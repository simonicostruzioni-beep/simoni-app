<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Impresa Simoni</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Simoni">
<meta name="theme-color" content="#1F2421">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2421;
    --steel:#4A5049;
    --concrete:#E4E0D6;
    --paper:#FBF9F4;
    --orange:#E8590C;
    --orange-dark:#C44A08;
    --green:#4C7A52;
    --red:#B23A2E;
    --border:#CFC9B8;
    --border-soft:#E2DDCF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--concrete);color:var(--ink);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--concrete);padding-bottom:30px;position:relative;}

  .topbar{background:var(--ink);color:var(--paper);padding:18px 20px 16px;position:sticky;top:0;z-index:20;}
  .topbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar h1{font-size:19px;margin:0;color:#fff;}
  .topbar .sub{font-size:12px;color:#C9C4B4;margin-top:2px;letter-spacing:.02em;text-transform:none;font-family:'Inter',sans-serif;}
  .icon-btn{background:none;border:1px solid #444943;color:#fff;border-radius:6px;padding:7px 10px;font-size:15px;cursor:pointer;}

  .content{padding:20px;}
  .card{background:var(--paper);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--steel);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  input[type=text], input[type=number], input[type=password], input[type=date], select, textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:15.5px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:var(--orange);}
  .field{margin-bottom:14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:13px 18px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;transition:transform .06s ease;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--border);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:12.5px;}
  .err{background:#FBEAE7;border:1px solid var(--red);color:var(--red);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:14px;}
  .hint{font-size:12px;color:var(--steel);margin-top:4px;}

  .login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--paper);border-radius:14px;padding:32px 26px;width:100%;max-width:380px;border:1px solid var(--border-soft);box-shadow:0 12px 30px rgba(31,36,33,.12);}
  .login-badge{width:56px;height:56px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff;font-family:'Oswald';font-weight:700;font-size:22px;}
  .login-card h1{text-align:center;font-size:22px;margin:0 0 4px;}
  .login-sub{text-align:center;color:var(--steel);font-size:13.5px;margin-bottom:22px;}

  /* HOME */
  .home-btn{display:flex;align-items:center;gap:16px;background:var(--paper);border:1.5px solid var(--border-soft);border-radius:14px;padding:20px;margin-bottom:14px;cursor:pointer;text-align:left;width:100%;}
  .home-btn:active{transform:scale(.98);}
  .home-btn .ic{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
  .home-btn.a .ic{background:#FFF0E4;}
  .home-btn.c .ic{background:#EAEEF7;}
  .home-btn .txt h3{margin:0 0 3px;font-size:16px;}
  .home-btn .txt p{margin:0;font-size:12.5px;color:var(--steel);font-family:'Inter';text-transform:none;letter-spacing:0;}

  /* CANTIERI grid */

  /* checklist operai */
  .op-row{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .op-row .head{display:flex;align-items:center;gap:10px;}
  .op-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--orange);flex-shrink:0;}
  .op-row .name{flex:1;font-weight:600;font-size:14.5px;}
  .op-row .ore-slider-wrap{display:none;align-items:center;gap:10px;width:100%;margin-top:12px;padding-top:2px;}
  .op-row:not(.off) .ore-slider-wrap{display:flex;}
  .op-row .ore-slider{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:4px;background:var(--border);outline:none;}
  .op-row .ore-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;}
  .op-row .ore-slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;border:none;}
  .op-row .ore-val{font-weight:700;font-size:14px;min-width:34px;text-align:right;color:var(--orange-dark);}



  /* quaderno */
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .filters > div{flex:1;min-width:130px;}
  .ticket{background:#fff;border:1px solid var(--border-soft);border-radius:6px;padding:10px 12px 10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;overflow:hidden;}
  .ticket::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange);}
  .ticket .main{flex:1;min-width:0;cursor:pointer;}
  .ticket .date{font-family:'JetBrains Mono';font-weight:700;font-size:12.5px;}
  .ticket .site{font-size:12.5px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ticket .hrs{font-family:'JetBrains Mono';font-weight:700;font-size:13.5px;color:var(--orange-dark);flex-shrink:0;}
  .ticket .del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0;}


  .back-link{background:none;border:none;color:var(--paper);font-family:'Inter';font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:2px;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--steel);}
  .empty-state .big{font-size:34px;margin-bottom:8px;}

  .loading-overlay{position:fixed;inset:0;background:rgba(31,36,33,.6);z-index:999;display:flex;align-items:center;justify-content:center;}
  .loading-box{background:var(--paper);border-radius:14px;padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 14px 34px rgba(0,0,0,.3);font-size:14px;font-weight:600;color:var(--ink);}
  .spinner{width:36px;height:36px;border:4px solid var(--border-soft);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= CONFIGURAZIONE ================= */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwyxmCOmaDPArif8hp4F3Dwyt1EeO2UsmbdwSfVAiSsNX6fJvCng6K5PeDVfwYNjodFHg/exec';
const APP_PASSWORD = 'simoni2026'; // password unica per capocantiere/amministratore
const SESSION_KEY = 'is_session_v1';

/* ================= STATO ================= */
let S = {
  screen: 'login',
  authed: false,
  workers: [],
  sites: [],
  entries: [],
  loading: false,
  error: '',
  editEntryId: null,
  quadFilters: { cantiere: '', operaio: '', from: '', to: '' }
};

let FORM = null;       // stato form modifica giornata esistente (singolo record)
let DAY_SESSION = null; // stato sessione "nuova giornata" a due passaggi (ore + assegnazione cantieri)

const ORE_STANDARD_KEY = 'is_ore_standard_v1';
let ORE_STANDARD = Number(localStorage.getItem(ORE_STANDARD_KEY)) || 9; // solo per precompilare gli slider all'apertura
const ORE_RIFERIMENTO_MANCANTI = 8; // riferimento fisso per calcolare le ore mancanti (ferie/malattia/ecc.)

const MOTIVI_ORE_MANCANTI = ['Ferie', 'Cassa integrazione', 'Malattia', 'Altro'];

/* ================= API ================= */
async function apiCall(action, data) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action, data })
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}
async function refreshData() {
  S.loading = true; S.loadingLabel = 'Caricamento dati…'; render();
  try {
    const data = await apiCall('getAll');
    S.workers = data.workers || [];
    S.sites = data.sites || [];
    S.entries = data.entries || [];
  } catch (err) {
    S.error = 'Errore nel caricamento dati: ' + err.message;
  }
  S.loading = false; render();
}
async function saveEntriesRemote() { await apiCall('saveEntries', S.entries); }
async function saveSitesRemote() { await apiCall('saveSites', S.sites); }


/* ================= UTIL ================= */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function uid(prefix) {
  return prefix + '_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
let SUPPRESS_HISTORY_PUSH = false; // evita di ri-registrare una voce quando stiamo già rispondendo al tasto indietro

function goto(screen) {
  S.screen = screen;
  S.error = '';
  if (!SUPPRESS_HISTORY_PUSH) {
    history.pushState({ screen }, '', location.href);
  }
  render();
  window.scrollTo(0, 0);
}

/* Tasto/gesto "indietro" del telefono: invece di uscire dalla pagina, naviga
   indietro dentro l'app come farebbe il pulsante "Indietro" in alto. */
window.addEventListener('popstate', () => {
  if (S.screen === 'home' || S.screen === 'login') return; // niente da annullare: lascia fare al browser
  SUPPRESS_HISTORY_PUSH = true;
  goBack();
  SUPPRESS_HISTORY_PUSH = false;
});

function clearSession() { localStorage.removeItem(SESSION_KEY); }
function hasSession() { return localStorage.getItem(SESSION_KEY) === '1'; }

/* ================= FORM GIORNATA ================= */
function freshGiornataForm() {
  const operai = {};
  S.workers.forEach(w => { operai[w] = { presente: false, ore: 8 }; });
  return { date: todayStr(), cantiere: S.sites[0] || '', lavorazioni: '', materiali: '', operai };
}
function loadGiornataForm(entry) {
  const operai = {};
  S.workers.forEach(w => { operai[w] = { presente: false, ore: 8 }; });
  (entry.operai || []).forEach(o => { operai[o.nome] = { presente: true, ore: o.ore }; });
  return { date: entry.date, cantiere: entry.cantiere, lavorazioni: entry.lavorazioni, materiali: entry.materiali, operai };
}

/* ================= NUOVA GIORNATA (flusso a due passaggi) ================= */
function freshDaySession() {
  const operai = {};
  S.workers.forEach(w => { operai[w] = { ore: ORE_STANDARD, touched: false, motivo: '' }; });
  return { date: todayStr(), operai, remaining: null, cantiereForm: { cantiere: S.sites[0] || '', lavorazioni: '', materiali: '' } };
}

function promptOreStandard() {
  const val = window.prompt('Ore standard giornaliere (usate come valore predefinito per i nuovi inserimenti):', String(ORE_STANDARD));
  if (val === null) return;
  const num = parseFloat(String(val).replace(',', '.'));
  if (!isFinite(num) || num <= 0) { alert('Inserisci un numero valido maggiore di zero.'); return; }
  ORE_STANDARD = num;
  localStorage.setItem(ORE_STANDARD_KEY, String(num));
  if (DAY_SESSION) {
    S.workers.forEach(w => {
      if (DAY_SESSION.operai[w] && !DAY_SESSION.operai[w].touched) {
        DAY_SESSION.operai[w].ore = num;
      }
    });
  }
  render();
}

/* ================= RENDER ================= */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = renderScreen() + (S.loading ? loadingOverlayHtml() : '');
  bindEvents();
}

function loadingOverlayHtml() {
  return `
  <div class="loading-overlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <div>${escapeHtml(S.loadingLabel || 'Caricamento in corso…')}</div>
    </div>
  </div>`;
}


function renderScreen() {
  if (S.screen === 'login') return screenLogin();
  if (S.screen === 'home') return screenHome();
  if (S.screen === 'giornata-ore') return screenGiornataOre();
  if (S.screen === 'giornata-cantiere') return screenGiornataCantiere();
  if (S.screen === 'giornata') return screenGiornata();
  if (S.screen === 'quaderno') return screenQuaderno();
  return '<div class="content">Schermata non trovata.</div>';
}

function topbar(title, sub, showBack) {
  const subText = S.loading ? 'Aggiornamento dati…' : sub;
  return `
  <div class="topbar">
    <div class="row">
      <div>
        ${showBack ? `<button class="back-link" id="back-btn">&larr; Indietro</button>` : ''}
        <h1>${escapeHtml(title)}</h1>
        ${subText ? `<div class="sub">${escapeHtml(subText)}</div>` : ''}
      </div>
      <button class="icon-btn" id="refresh-btn" title="Aggiorna" ${S.loading ? 'disabled' : ''}>&#8635;</button>
    </div>
  </div>`;
}


function screenLogin() {
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-badge">IS</div>
      <h1>Impresa Simoni</h1>
      <div class="login-sub">Accesso riservato a capocantiere e amministratore</div>
      ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
      <form id="login-form">
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-pass" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entra</button>
      </form>
    </div>
  </div>`;
}

function screenHome() {
  return `
  ${topbar('Impresa Simoni', 'Cosa vuoi fare?')}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    <button class="home-btn a" id="go-giornata">
      <div class="ic">&#128203;</div>
      <div class="txt"><h3>Inserisci giornata</h3><p>Ore lavorate, cantiere e lavorazioni di oggi</p></div>
    </button>
    <button class="home-btn c" id="go-quaderno">
      <div class="ic">&#128214;</div>
      <div class="txt"><h3>Quaderno cantieri</h3><p>Storico giornate, filtri, modifica</p></div>
    </button>
  </div>`;
}

function screenGiornataOre() {
  if (!DAY_SESSION) DAY_SESSION = freshDaySession();
  S.workers.forEach(w => { if (!DAY_SESSION.operai[w]) DAY_SESSION.operai[w] = { ore: ORE_STANDARD, touched: false, motivo: '' }; });

  const rows = S.workers.map((w, i) => {
    const st = DAY_SESSION.operai[w];
    const showMotivo = st.ore < ORE_RIFERIMENTO_MANCANTI;
    return `
    <div class="op-row on" data-worker="${escapeHtml(w)}" data-first="${i === 0 ? '1' : '0'}">
      <div class="head">
        <div class="name">${escapeHtml(w)}</div>
        <div class="ore-val mono">${st.ore}h</div>
      </div>
      <div class="ore-slider-wrap">
        <input type="range" class="ore-slider ds-ore" min="0" max="12" step="0.5" value="${st.ore}">
      </div>
      ${showMotivo ? `
      <div class="field" style="margin-top:10px;margin-bottom:0;">
        <label>Motivo ore mancanti (mancano ${(ORE_RIFERIMENTO_MANCANTI - st.ore).toFixed(1).replace('.0', '')}h su 8h)</label>
        <select class="ds-motivo">
          <option value="">Seleziona...</option>
          ${MOTIVI_ORE_MANCANTI.map(m => `<option value="${m}" ${st.motivo === m ? 'selected' : ''}>${m}</option>`).join('')}
        </select>
      </div>` : ''}
    </div>`;
  }).join('');

  return `
  ${topbar('Nuova giornata', 'Passo 1 di 2 — ore lavorate', true)}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    <div class="card">
      <div class="field">
        <label>Data</label>
        <input type="date" id="ds-date" value="${DAY_SESSION.date}">
      </div>
      <div class="field">
        <label>Ore lavorate per operaio</label>
        ${S.workers.length ? rows : `<div class="hint">Nessun operaio configurato: aggiungili dalla pagina Admin.</div>`}
      </div>
    </div>
    <button class="btn btn-ghost btn-block" id="set-standard-btn" style="margin-bottom:12px;">&#9881;&#65039; Imposta ore iniziali predefinite (attuale: ${ORE_STANDARD}h)</button>
    <button class="btn btn-primary btn-block" id="ds-avanti-btn">Avanti &rarr;</button>
  </div>`;
}

function screenGiornataCantiere() {
  const remaining = DAY_SESSION.remaining;
  const activeWorkers = S.workers.filter(w => (remaining[w] || 0) > 0.001);
  const doneWorkers = S.workers.filter(w => (remaining[w] || 0) <= 0.001 && DAY_SESSION.operai[w].ore > 0);
  const cf = DAY_SESSION.cantiereForm;

  const rows = activeWorkers.map(w => `
    <div class="op-row on" data-worker="${escapeHtml(w)}">
      <div class="head">
        <div class="name">${escapeHtml(w)} <span class="hint" style="text-transform:none;">(rimangono ${remaining[w]}h)</span></div>
        <div class="ore-val mono">${remaining[w]}h</div>
      </div>
      <div class="ore-slider-wrap">
        <input type="range" class="ore-slider gc-ore" min="0" max="${remaining[w]}" step="0.5" value="${remaining[w]}">
      </div>
    </div>`).join('');

  const doneHtml = doneWorkers.length ? `<div class="hint" style="margin-top:8px;">Ore già assegnate del tutto: ${doneWorkers.map(escapeHtml).join(', ')}</div>` : '';

  return `
  ${topbar('Nuova giornata', 'Passo 2 di 2 — assegna ai cantieri', true)}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    <div class="card">
      <div class="field">
        <label>Ore da assegnare a questo cantiere</label>
        ${activeWorkers.length ? rows : `<div class="hint">Tutte le ore della giornata sono già state assegnate.</div>`}
        ${doneHtml}
      </div>
      <div class="field">
        <label>Cantiere</label>
        <select id="gc-cantiere">
          ${S.sites.map(s => `<option value="${escapeHtml(s)}" ${s === cf.cantiere ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
        </select>
        <div class="hint">Non trovi il cantiere? <a href="#" id="gc-new-site">Aggiungine uno nuovo</a></div>
      </div>
      <div class="field">
        <label>Lavorazioni effettuate</label>
        <textarea id="gc-lavorazioni" placeholder="Es. scavo fondazioni, posa tubi...">${escapeHtml(cf.lavorazioni)}</textarea>
      </div>
      <div class="field">
        <label>Materiali utilizzati</label>
        <textarea id="gc-materiali" placeholder="Es. 20 sacchi cemento, tubi PVC...">${escapeHtml(cf.materiali)}</textarea>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="gc-save-btn" ${activeWorkers.length ? '' : 'disabled'}>Salva assegnazione</button>
    <button class="btn btn-ghost btn-block" id="gc-fine-btn" style="margin-top:10px;">Termina per oggi</button>
  </div>`;
}


function screenGiornata() {
  if (!FORM) FORM = S.editEntryId ? loadGiornataForm(S.entries.find(e => e.id === S.editEntryId)) : freshGiornataForm();
  S.workers.forEach(w => { if (!FORM.operai[w]) FORM.operai[w] = { presente: false, ore: 8 }; });
  if (!FORM.cantiere && S.sites.length) FORM.cantiere = S.sites[0];
  const isEdit = !!S.editEntryId;
  const opRows = S.workers.map(w => {
    const st = FORM.operai[w] || { presente: false, ore: 8 };
    return `
    <div class="op-row ${st.presente ? '' : 'off'}" data-worker="${escapeHtml(w)}">
      <div class="head">
        <input type="checkbox" class="op-check" ${st.presente ? 'checked' : ''}>
        <div class="name">${escapeHtml(w)}</div>
        <div class="ore-val mono">${st.ore}h</div>
      </div>
      <div class="ore-slider-wrap">
        <input type="range" class="ore-slider op-ore" min="1" max="9.5" step="0.5" value="${st.ore}">
      </div>
    </div>`;
  }).join('');

  return `
  ${topbar(isEdit ? 'Modifica giornata' : 'Inserisci giornata', '', true)}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    <div class="card">
      <div class="field">
        <label>Data</label>
        <input type="date" id="f-date" value="${FORM.date}">
      </div>
      <div class="field">
        <label>Cantiere</label>
        <select id="f-cantiere">
          ${S.sites.map(s => `<option value="${escapeHtml(s)}" ${s === FORM.cantiere ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
        </select>
        <div class="hint">Non trovi il cantiere? <a href="#" id="f-new-site">Aggiungine uno nuovo</a></div>
      </div>
      <div class="field">
        <label>Operai presenti e ore</label>
        ${S.workers.length ? opRows : `<div class="hint">Nessun operaio configurato: aggiungili dalla pagina Admin.</div>`}
      </div>
      <div class="field">
        <label>Lavorazioni effettuate</label>
        <textarea id="f-lavorazioni" placeholder="Es. scavo fondazioni, posa tubi...">${escapeHtml(FORM.lavorazioni)}</textarea>
      </div>
      <div class="field">
        <label>Materiali utilizzati</label>
        <textarea id="f-materiali" placeholder="Es. 20 sacchi cemento, tubi PVC...">${escapeHtml(FORM.materiali)}</textarea>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="save-giornata-btn">${isEdit ? 'Salva modifiche' : 'Salva giornata'}</button>
    ${isEdit ? `<button class="btn btn-danger btn-block" id="delete-giornata-btn" style="margin-top:10px;">Elimina giornata</button>` : ''}
  </div>`;
}




function screenQuaderno() {
  const f = S.quadFilters;
  let rows = S.entries.slice();
  if (f.cantiere) rows = rows.filter(e => e.cantiere === f.cantiere);
  if (f.operaio) rows = rows.filter(e => (e.operai || []).some(o => o.nome === f.operaio));
  if (f.from) rows = rows.filter(e => e.date >= f.from);
  if (f.to) rows = rows.filter(e => e.date <= f.to);
  rows.sort((a, b) => b.date.localeCompare(a.date));

  const tickets = rows.map(e => {
    const tot = (e.operai || []).reduce((s, o) => s + (Number(o.ore) || 0), 0);
    return `
    <div class="ticket">
      <div class="main" data-id="${e.id}">
        <div class="date mono">${fmtDate(e.date)}</div>
        <div class="site">${escapeHtml(e.cantiere)}</div>
      </div>
      <div class="hrs mono">${tot}h</div>
      <button class="del" data-id="${e.id}" title="Elimina">&#128465;</button>
    </div>`;
  }).join('');

  return `
  ${topbar('Quaderno cantieri', 'Storico giornate', true)}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    <div class="filters">
      <div>
        <label>Cantiere</label>
        <select id="qf-cantiere">
          <option value="">Tutti</option>
          ${S.sites.map(s => `<option value="${escapeHtml(s)}" ${f.cantiere === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Operaio</label>
        <select id="qf-operaio">
          <option value="">Tutti</option>
          ${S.workers.map(w => `<option value="${escapeHtml(w)}" ${f.operaio === w ? 'selected' : ''}>${escapeHtml(w)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Da</label>
        <input type="date" id="qf-from" value="${f.from}">
      </div>
      <div>
        <label>A</label>
        <input type="date" id="qf-to" value="${f.to}">
      </div>
    </div>
    ${rows.length ? tickets : `<div class="empty-state"><div class="big">&#128203;</div>Nessuna giornata trovata.</div>`}
  </div>`;
}

/* ================= EVENTI ================= */
function goBack() {
  if (S.screen === 'giornata') { FORM = null; S.editEntryId = null; goto('home'); return; }
  if (S.screen === 'giornata-cantiere') { goto('giornata-ore'); return; }
  if (S.screen === 'giornata-ore') { DAY_SESSION = null; goto('home'); return; }
  goto('home');
}

function bindEvents() {
  const backBtn = document.getElementById('back-btn');
  if (backBtn) backBtn.addEventListener('click', goBack);
  const refreshBtn = document.getElementById('refresh-btn');
  if (refreshBtn) refreshBtn.addEventListener('click', refreshData);

  if (S.screen === 'login') {
    document.getElementById('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const p = document.getElementById('login-pass').value;
      if (p === APP_PASSWORD) {
        localStorage.setItem(SESSION_KEY, '1');
        S.authed = true; S.error = '';
        goto('home');
        refreshData();
      } else {
        S.error = 'Password non corretta.'; render();
      }
    });
  }

  if (S.screen === 'home') {
    document.getElementById('go-giornata').addEventListener('click', () => { DAY_SESSION = null; goto('giornata-ore'); });
    document.getElementById('go-quaderno').addEventListener('click', () => goto('quaderno'));
  }

  if (S.screen === 'giornata-ore') bindGiornataOreEvents();
  if (S.screen === 'giornata-cantiere') bindGiornataCantiereEvents();
  if (S.screen === 'giornata') bindGiornataEvents();
  if (S.screen === 'quaderno') bindQuadernoEvents();
}

function bindGiornataOreEvents() {
  document.getElementById('ds-date').addEventListener('change', e => { DAY_SESSION.date = e.target.value || todayStr(); });

  document.querySelectorAll('#app .op-row[data-worker]').forEach(row => {
    const worker = row.dataset.worker;
    const isFirst = row.dataset.first === '1';
    const slider = row.querySelector('.ds-ore');
    if (slider) {
      // Durante il trascinamento: aggiorna solo i numeri a video, senza rifare il render
      // (rifare il render mentre lo slider è "premuto" è la causa dello scatto).
      slider.addEventListener('input', () => {
        const val = Number(slider.value);
        DAY_SESSION.operai[worker].ore = val;
        DAY_SESSION.operai[worker].touched = true;
        const valEl = row.querySelector('.ore-val');
        if (valEl) valEl.textContent = val + 'h';
        if (isFirst) {
          S.workers.forEach(other => {
            if (other !== worker && !DAY_SESSION.operai[other].touched) {
              DAY_SESSION.operai[other].ore = val;
              const otherRow = document.querySelector(`.op-row[data-worker="${CSS.escape(other)}"]`);
              if (otherRow) {
                const otherSlider = otherRow.querySelector('.ds-ore');
                const otherValEl = otherRow.querySelector('.ore-val');
                if (otherSlider) otherSlider.value = val;
                if (otherValEl) otherValEl.textContent = val + 'h';
              }
            }
          });
        }
      });
      // Al rilascio: ricalcola l'intera schermata (mostra/nasconde il motivo ore mancanti, ecc.)
      slider.addEventListener('change', () => { render(); });
    }
    const motivoSel = row.querySelector('.ds-motivo');
    if (motivoSel) motivoSel.addEventListener('change', () => { DAY_SESSION.operai[worker].motivo = motivoSel.value; });
  });

  document.getElementById('set-standard-btn').addEventListener('click', promptOreStandard);

  document.getElementById('ds-avanti-btn').addEventListener('click', async () => {
    const missing = S.workers.filter(w => DAY_SESSION.operai[w].ore < ORE_RIFERIMENTO_MANCANTI && !DAY_SESSION.operai[w].motivo);
    if (missing.length) {
      alert('Seleziona il motivo delle ore mancanti per: ' + missing.join(', '));
      return;
    }
    if (!S.workers.length) { alert('Nessun operaio configurato.'); return; }

    DAY_SESSION.remaining = {};
    S.workers.forEach(w => { DAY_SESSION.remaining[w] = DAY_SESSION.operai[w].ore; });

    const btn = document.getElementById('ds-avanti-btn');
    btn.disabled = true; btn.textContent = 'Salvataggio…';
    try {
      const nowIso = new Date().toISOString();
      const payload = S.workers.map(w => ({
        date: DAY_SESSION.date, operaio: w,
        oreStandard: ORE_RIFERIMENTO_MANCANTI, oreLavorate: DAY_SESSION.operai[w].ore,
        motivo: DAY_SESSION.operai[w].ore < ORE_RIFERIMENTO_MANCANTI ? DAY_SESSION.operai[w].motivo : '',
        updatedAt: nowIso
      }));
      await apiCall('saveOreGiorno', payload);
      goto('giornata-cantiere');
    } catch (err) {
      alert('Errore nel salvataggio: ' + err.message);
      btn.disabled = false; btn.textContent = 'Avanti →';
    }
  });
}

function bindGiornataCantiereEvents() {
  document.querySelectorAll('#app .op-row[data-worker]').forEach(row => {
    const worker = row.dataset.worker;
    const slider = row.querySelector('.gc-ore');
    if (slider) slider.addEventListener('input', () => {
      row.querySelector('.ore-val').textContent = Number(slider.value) + 'h';
    });
  });

  document.getElementById('gc-new-site').addEventListener('click', async e => {
    e.preventDefault();
    const name = window.prompt('Nome del nuovo cantiere:');
    if (!name || !name.trim()) return;
    if (S.sites.includes(name.trim())) { alert('Cantiere già presente.'); return; }
    S.sites.push(name.trim());
    DAY_SESSION.cantiereForm.cantiere = name.trim();
    try { await saveSitesRemote(); } catch (err) { alert('Errore salvataggio cantiere: ' + err.message); }
    render();
  });

  const fineBtn = document.getElementById('gc-fine-btn');
  fineBtn.addEventListener('click', () => {
    if (!window.confirm('Terminare la giornata? Le ore non ancora assegnate a un cantiere resteranno registrate solo nel motivo/ore standard, non in nessuna scheda cantiere.')) return;
    DAY_SESSION = null;
    goto('quaderno');
  });

  const saveBtn = document.getElementById('gc-save-btn');
  if (!saveBtn) return;
  saveBtn.addEventListener('click', async () => {
    DAY_SESSION.cantiereForm.cantiere = document.getElementById('gc-cantiere').value;
    DAY_SESSION.cantiereForm.lavorazioni = document.getElementById('gc-lavorazioni').value;
    DAY_SESSION.cantiereForm.materiali = document.getElementById('gc-materiali').value;
    if (!DAY_SESSION.cantiereForm.cantiere) { alert('Seleziona un cantiere.'); return; }

    const operaiList = [];
    document.querySelectorAll('#app .op-row[data-worker]').forEach(row => {
      const worker = row.dataset.worker;
      const slider = row.querySelector('.gc-ore');
      const val = slider ? Number(slider.value) : 0;
      if (val > 0) operaiList.push({ nome: worker, ore: val });
    });
    if (!operaiList.length) { alert('Assegna almeno un\'ora a un operaio.'); return; }

    const entry = {
      id: uid('e'), date: DAY_SESSION.date, cantiere: DAY_SESSION.cantiereForm.cantiere,
      lavorazioni: DAY_SESSION.cantiereForm.lavorazioni, materiali: DAY_SESSION.cantiereForm.materiali,
      operai: operaiList, updatedAt: new Date().toISOString()
    };

    saveBtn.disabled = true; saveBtn.textContent = 'Salvataggio…';
    S.entries.push(entry);
    try {
      await saveEntriesRemote();
      operaiList.forEach(o => { DAY_SESSION.remaining[o.nome] = Math.max(0, Math.round((DAY_SESSION.remaining[o.nome] - o.ore) * 2) / 2); });
      DAY_SESSION.cantiereForm = { cantiere: S.sites[0] || '', lavorazioni: '', materiali: '' };

      const anyRemaining = S.workers.some(w => (DAY_SESSION.remaining[w] || 0) > 0.001);
      if (!anyRemaining) {
        alert('Giornata completata: tutte le ore sono state assegnate.');
        DAY_SESSION = null;
        goto('quaderno');
      } else {
        render();
      }
    } catch (err) {
      alert('Errore nel salvataggio: ' + err.message);
      saveBtn.disabled = false; saveBtn.textContent = 'Salva assegnazione';
    }
  });
}


function bindGiornataEvents() {
  document.querySelectorAll('.op-row').forEach(row => {
    const worker = row.dataset.worker;
    const check = row.querySelector('.op-check');
    const slider = row.querySelector('.op-ore');
    const valEl = row.querySelector('.ore-val');
    check.addEventListener('change', () => {
      FORM.operai[worker].presente = check.checked;
      row.classList.toggle('off', !check.checked);
    });
    slider.addEventListener('input', () => {
      FORM.operai[worker].ore = Number(slider.value);
      valEl.textContent = Number(slider.value) + 'h';
    });
  });
  document.getElementById('f-new-site').addEventListener('click', async e => {
    e.preventDefault();
    const name = window.prompt('Nome del nuovo cantiere:');
    if (!name || !name.trim()) return;
    if (S.sites.includes(name.trim())) { alert('Cantiere già presente.'); return; }
    S.sites.push(name.trim());
    FORM.cantiere = name.trim();
    try { await saveSitesRemote(); } catch (err) { alert('Errore salvataggio cantiere: ' + err.message); }
    render();
  });
  document.getElementById('save-giornata-btn').addEventListener('click', async () => {
    FORM.date = document.getElementById('f-date').value || todayStr();
    FORM.cantiere = document.getElementById('f-cantiere').value;
    FORM.lavorazioni = document.getElementById('f-lavorazioni').value;
    FORM.materiali = document.getElementById('f-materiali').value;
    const operaiList = Object.keys(FORM.operai).filter(w => FORM.operai[w].presente).map(w => ({ nome: w, ore: FORM.operai[w].ore }));
    if (!FORM.cantiere) { alert('Seleziona un cantiere.'); return; }
    if (!operaiList.length) { alert('Seleziona almeno un operaio presente.'); return; }

    const entry = {
      id: S.editEntryId || uid('e'),
      date: FORM.date, cantiere: FORM.cantiere,
      lavorazioni: FORM.lavorazioni, materiali: FORM.materiali,
      operai: operaiList, updatedAt: new Date().toISOString()
    };
    const btn = document.getElementById('save-giornata-btn');
    btn.disabled = true; btn.textContent = 'Salvataggio…';
    if (S.editEntryId) {
      const idx = S.entries.findIndex(x => x.id === S.editEntryId);
      if (idx >= 0) S.entries[idx] = entry; else S.entries.push(entry);
    } else {
      S.entries.push(entry);
    }
    try {
      await saveEntriesRemote();
      FORM = null; S.editEntryId = null;
      goto('quaderno');
    } catch (err) {
      alert('Errore nel salvataggio: ' + err.message);
      btn.disabled = false; btn.textContent = 'Salva giornata';
    }
  });
  const delBtn = document.getElementById('delete-giornata-btn');
  if (delBtn) delBtn.addEventListener('click', async () => {
    if (!window.confirm('Eliminare definitivamente questa giornata?')) return;
    S.entries = S.entries.filter(e => e.id !== S.editEntryId);
    try { await saveEntriesRemote(); } catch (err) { alert('Errore: ' + err.message); }
    FORM = null; S.editEntryId = null;
    goto('quaderno');
  });
}







function bindQuadernoEvents() {
  document.getElementById('qf-cantiere').addEventListener('change', e => { S.quadFilters.cantiere = e.target.value; render(); });
  document.getElementById('qf-operaio').addEventListener('change', e => { S.quadFilters.operaio = e.target.value; render(); });
  document.getElementById('qf-from').addEventListener('change', e => { S.quadFilters.from = e.target.value; render(); });
  document.getElementById('qf-to').addEventListener('change', e => { S.quadFilters.to = e.target.value; render(); });
  document.querySelectorAll('.ticket .main').forEach(el => {
    el.addEventListener('click', () => { S.editEntryId = el.dataset.id; FORM = null; goto('giornata'); });
  });
  document.querySelectorAll('.ticket .del').forEach(el => {
    el.addEventListener('click', async () => {
      if (!window.confirm('Eliminare questa giornata dal quaderno?')) return;
      S.entries = S.entries.filter(e => e.id !== el.dataset.id);
      try { await saveEntriesRemote(); } catch (err) { alert('Errore: ' + err.message); }
      render();
    });
  });
}

/* ================= INIT ================= */
function init() {
  if (hasSession()) {
    S.authed = true;
    S.screen = 'home';
    render();
    refreshData();
  } else {
    render();
  }
}
init();
</script>
