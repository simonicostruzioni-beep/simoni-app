
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Registro Ore Cantiere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1F2421;
    --steel:#4A5049;
    --concrete:#E4E0D6;
    --paper:#FBF9F4;
    --orange:#E8590C;
    --orange-dark:#C44A08;
    --green:#4C7A52;
    --red:#B23A2E;
    --border:#CFC9B8;
    --border-soft:#E2DDCF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--concrete);color:var(--ink);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--concrete);padding-bottom:96px;position:relative;}
  .admin-wide #app{max-width:1100px;padding-bottom:40px;}

  .topbar{background:var(--ink);color:var(--paper);padding:18px 20px 16px;position:sticky;top:0;z-index:20;}
  .topbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar h1{font-size:19px;margin:0;color:#fff;}
  .topbar .sub{font-size:12px;color:#C9C4B4;margin-top:2px;letter-spacing:.02em;text-transform:none;font-family:'Inter',sans-serif;}
  .topbar-actions{display:flex;align-items:center;gap:14px;}
  .link-btn{background:none;border:none;color:var(--orange);font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;padding:6px 4px;}
  .link-btn:hover{text-decoration:underline;}
  .icon-btn{background:none;border:1px solid #444943;color:#fff;border-radius:6px;padding:6px 9px;font-size:14px;cursor:pointer;}

  .content{padding:20px;}
  .card{background:var(--paper);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--steel);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  input[type=text], input[type=password], input[type=date], select, textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:15.5px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:var(--orange);}
  .field{margin-bottom:14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:13px 18px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;transition:transform .06s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--border);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:12.5px;}
  .err{background:#FBEAE7;border:1px solid var(--red);color:var(--red);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:14px;}
  .warn{background:#FFF4EC;border:1px solid var(--orange);color:var(--orange-dark);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:14px;}
  .hint{font-size:12px;color:var(--steel);margin-top:4px;}

  .login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--paper);border-radius:14px;padding:32px 26px;width:100%;max-width:380px;border:1px solid var(--border-soft);box-shadow:0 12px 30px rgba(31,36,33,.12);}
  .login-badge{width:56px;height:56px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff;font-family:'Oswald';font-weight:700;font-size:22px;}
  .login-card h1{text-align:center;font-size:22px;margin:0 0 4px;}
  .login-sub{text-align:center;color:var(--steel);font-size:13.5px;margin-bottom:22px;}
  .foot-link{text-align:center;margin-top:18px;}
  .foot-link button{font-size:12px;color:var(--steel);}

  .checkrow{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border:1.5px solid var(--border);border-radius:8px;}
  .checkrow input{width:19px;height:19px;accent-color:var(--orange);flex-shrink:0;}
  .checkrow label{margin:0;text-transform:none;font-weight:500;font-size:14.5px;color:var(--ink);}

  .slider-wrap{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:14px 14px 10px;}
  .slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .slider-val{font-family:'JetBrains Mono';font-weight:700;font-size:20px;color:var(--orange-dark);}
  input[type=range]{width:100%;accent-color:var(--orange);height:6px;}

  .site-block{background:#fff;border:1.5px dashed var(--border);border-radius:8px;padding:14px;margin-bottom:12px;position:relative;}
  .site-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .site-block-head .tag{font-family:'Oswald';font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);background:var(--concrete);padding:3px 9px;border-radius:20px;}
  .remove-block{background:none;border:none;color:var(--red);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter';}
  .add-site-btn{width:100%;border:1.5px dashed var(--orange);background:#FFF4EC;color:var(--orange-dark);border-radius:8px;padding:11px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Inter';margin-bottom:16px;}

  .total-strip{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:12px 16px;border-radius:8px;margin-bottom:16px;}
  .total-strip .lbl{font-size:12px;color:#C9C4B4;text-transform:uppercase;letter-spacing:.04em;}
  .total-strip .val{font-family:'JetBrains Mono';font-weight:700;font-size:19px;}

  .actionbar{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--border-soft);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:520px;margin:0 auto;z-index:30;box-shadow:0 -4px 16px rgba(0,0,0,.06);}
  .admin-wide .actionbar{display:none;}
  .actionbar .btn{flex:1;padding:12px 6px;font-size:12.5px;}

  .month-picker{display:flex;gap:8px;align-items:center;margin-bottom:14px;}
  .month-picker select{flex:1;}
  .stamp{width:90px;height:90px;border-radius:50%;border:3px solid var(--orange);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px auto 18px;transform:rotate(-6deg);}
  .stamp .n{font-family:'JetBrains Mono';font-weight:700;font-size:22px;color:var(--orange-dark);line-height:1;}
  .stamp .l{font-family:'Oswald';font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-dark);margin-top:2px;}
  .ticket{background:#fff;border:1px solid var(--border-soft);border-radius:6px;padding:8px 12px 8px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;position:relative;overflow:hidden;}
  .ticket::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange);}
  .ticket:hover{border-color:var(--orange);}
  .ticket .left{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1;}
  .ticket .date{font-family:'JetBrains Mono';font-weight:700;font-size:12.5px;flex-shrink:0;}
  .ticket .sites{font-size:12px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ticket .hrs{font-family:'JetBrains Mono';font-weight:700;font-size:14px;color:var(--orange-dark);flex-shrink:0;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--steel);}
  .empty-state .big{font-size:34px;margin-bottom:8px;}

  .tabs{display:flex;gap:6px;padding:16px 20px 0;border-bottom:1px solid var(--border-soft);}
  .tab-btn{background:none;border:none;padding:10px 14px;font-family:'Oswald';font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--steel);cursor:pointer;border-bottom:3px solid transparent;}
  .tab-btn.active{color:var(--orange-dark);border-bottom-color:var(--orange);}
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .filters > div{flex:1;min-width:150px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;font-size:13px;}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border-soft);}
  th{background:var(--ink);color:#fff;font-family:'Oswald';font-weight:500;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;}
  tbody tr:hover{background:#FFF8F0;}
  .table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border-soft);}
  .admin-total{margin-top:12px;font-family:'JetBrains Mono';font-weight:700;text-align:right;}
  .userrow{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;padding:10px;background:#fff;border:1px solid var(--border-soft);border-radius:8px;margin-bottom:8px;}
  .siterow{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border:1px solid var(--border-soft);border-radius:8px;margin-bottom:8px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .cfg-box{background:#fff;border:1px solid var(--border-soft);border-radius:8px;padding:14px;margin-top:14px;}
  .cfg-box code{display:block;background:var(--concrete);padding:8px 10px;border-radius:6px;margin-top:6px;font-size:12px;word-break:break-all;}
  .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;margin:0 auto 14px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (max-width:700px){
    .admin-wide #app{padding:0;}
    .userrow{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   CONFIGURAZIONE — obbligatoria prima dell'uso
   Incolla qui l'URL del tuo Google Apps Script Web App (vedi ISTRUZIONI.md)
   ===================================================================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbweWXQHAzzw1wWo9p-oSY01E_qqnqc1Z7jW_Gn4RTKBq390Vw7LwAh93K-ZGwaCBD2-eg/exec';

/* Credenziali di accesso alla pagina Amministrazione (modifica pure) */
const ADMIN_USER = 'admin';
const ADMIN_PASS = 'admin';

/* ================= STATE ================= */
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MOTIVI = { ferie:'Ferie', malattia:'Malattia', cassa_meteo:'Cassa meteo' };

let S = {
  screen: 'loading',
  worker: null,
  workers: [],
  sites: [],
  entries: [],
  editId: null,
  viewMonth: null,
  admin: { loggedIn:false, tab:'registro', filters:{worker:'',cantiere:'',from:'',to:''} },
  loginErr: '', adminErr: '', loadErr: ''
};

/* ================= BACKEND (Google Sheet via Apps Script) ================= */
async function apiGetAll(){
  const res = await fetch(APPS_SCRIPT_URL + '?action=getAll');
  if(!res.ok) throw new Error('Errore di rete (' + res.status + ')');
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json;
}
async function apiSave(action, data){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita il preflight CORS
    body: JSON.stringify({ action, data })
  });
  const json = await res.json().catch(()=>({}));
  if(json && json.error) throw new Error(json.error);
  return json;
}

/* Sessione locale (ricorda l'operaio su questo dispositivo) */
function getSession(){ try{ return JSON.parse(localStorage.getItem('rc_session') || 'null'); }catch(e){ return null; } }
function setSession(obj){ try{ localStorage.setItem('rc_session', JSON.stringify(obj)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem('rc_session'); }catch(e){} }

/* ================= UTIL ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function monthKey(iso){ return iso ? iso.slice(0,7) : ''; }
function monthLabel(mk){ if(!mk) return ''; const [y,m]=mk.split('-'); return `${MESI[parseInt(m,10)-1]} ${y}`; }
function fmtHrs(n){ n = Math.round(n*10)/10; return (n % 1 === 0) ? String(n) : String(n).replace('.', ','); }
function setBodyClass(){ document.body.className = (S.screen==='admin' || S.screen==='adminlogin') ? 'admin-wide' : ''; }

/* ================= INIT ================= */
async function init(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('INCOLLA_QUI') === 0){
    S.screen = 'configerror';
    S.loadErr = 'missing-url';
    render();
    return;
  }
  try{
    const all = await apiGetAll();
    S.workers = all.workers || [];
    S.sites = (all.sites && all.sites.length) ? all.sites : [];
    S.entries = all.entries || [];
  }catch(err){
    S.screen = 'configerror';
    S.loadErr = err.message || String(err);
    render();
    return;
  }
  const session = getSession();
  if(session && session.name && S.workers.some(w=>w.name===session.name)){
    S.worker = session.name;
    S.screen = 'main';
  } else {
    S.screen = 'login';
  }
  render();
}

async function refreshData(){
  try{
    const all = await apiGetAll();
    S.workers = all.workers || [];
    S.sites = all.sites || [];
    S.entries = all.entries || [];
  }catch(err){
    alert('Impossibile aggiornare i dati: ' + (err.message||err));
  }
}

/* ================= NAV HELPERS ================= */
function goto(screen){ S.screen = screen; render(); }

function freshForm(){
  const lastEntry = S.entries.filter(e=>e.worker===S.worker).sort((a,b)=> (b.date+ (b.updatedAt||'')).localeCompare(a.date+(a.updatedAt||'')))[0];
  const defaultSite = (lastEntry && lastEntry.sites[0] && lastEntry.sites[0].cantiere) || S.sites[0] || '';
  return {
    date: todayStr(),
    pranzoACasa: false,
    missingType: '',
    sites: [{ cantiere: defaultSite, ore: 8, lavorazioni:'', materiali:'' }]
  };
}

let CURRENT_FORM = null;

/* ================= RENDER ROOT ================= */
function render(){
  setBodyClass();
  const app = document.getElementById('app');
  if(S.screen==='loading') app.innerHTML = `<div style="padding:80px 20px;text-align:center;color:var(--steel)"><div class="spinner"></div>Caricamento dati dal foglio Google…</div>`;
  else if(S.screen==='configerror') app.innerHTML = renderConfigError();
  else if(S.screen==='login') app.innerHTML = renderLogin();
  else if(S.screen==='main') { CURRENT_FORM = S.editId ? loadFormFromEntry(S.editId) : (CURRENT_FORM && CURRENT_FORM._keep ? CURRENT_FORM : freshForm()); app.innerHTML = renderMain(); }
  else if(S.screen==='view') app.innerHTML = renderView();
  else if(S.screen==='adminlogin') app.innerHTML = renderAdminLogin();
  else if(S.screen==='admin') app.innerHTML = renderAdmin();
  attachHandlers();
}

/* ================= CONFIG ERROR SCREEN ================= */
function renderConfigError(){
  const missingUrl = S.loadErr === 'missing-url';
  return `
  <div class="login-wrap">
    <div class="login-card" style="max-width:460px">
      <div class="login-badge" style="background:var(--red)">!</div>
      <h1>Configurazione richiesta</h1>
      ${missingUrl ? `
        <div class="warn">Nel file <b>index.html</b> devi incollare l'URL del tuo Google Apps Script al posto di <code class="mono">INCOLLA_QUI_IL_TUO_URL_APPS_SCRIPT</code>.</div>
        <p style="font-size:13.5px;color:var(--steel)">Segui le istruzioni in <b>ISTRUZIONI.md</b> per creare il Google Sheet, pubblicare lo script e collegarlo qui.</p>
      ` : `
        <div class="err">Non riesco a contattare il foglio Google.<br><span class="mono" style="font-size:12px">${escapeHtml(S.loadErr)}</span></div>
        <p style="font-size:13.5px;color:var(--steel)">Controlla che:</p>
        <ul style="font-size:13.5px;color:var(--steel);padding-left:18px">
          <li>l'URL Apps Script sia corretto e completo</li>
          <li>il deployment sia impostato su "Chiunque abbia accesso"</li>
          <li>il telefono/computer sia connesso a internet</li>
        </ul>
        <button class="btn btn-primary btn-block" id="retry-btn" style="margin-top:10px">Riprova</button>
      `}
    </div>
  </div>`;
}

/* ================= LOGIN (OPERAIO) ================= */
function renderLogin(){
  const options = S.workers.map(w=>`<option value="${escapeHtml(w.name)}">${escapeHtml(w.name)}</option>`).join('');
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-badge">RC</div>
      <h1>Registro Ore</h1>
      <div class="login-sub">Accedi con il nome e la password che ti ha dato l'ufficio</div>
      ${S.loginErr ? `<div class="err">${escapeHtml(S.loginErr)}</div>` : ''}
      ${S.workers.length===0 ? `<div class="err">Nessun operaio configurato. Contatta l'amministratore.</div>` : `
      <form id="login-form">
        <div class="field">
          <label>Nome</label>
          <select id="login-name" required>${options}</select>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-pass" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entra</button>
      </form>`}
      <div class="foot-link"><button id="go-admin">Amministrazione →</button></div>
    </div>
  </div>`;
}

/* ================= MAIN (INSERIMENTO / MODIFICA) ================= */
function siteBlockHtml(site, idx, removable){
  return `
  <div class="site-block" data-idx="${idx}">
    <div class="site-block-head">
      <span class="tag">Cantiere ${idx+1}</span>
      ${removable ? `<button type="button" class="remove-block">Rimuovi</button>` : ''}
    </div>
    <div class="field">
      <label>Cantiere</label>
      <select class="f-cantiere site-select">
        ${S.sites.map(s=>`<option value="${escapeHtml(s)}" ${s===site.cantiere?'selected':''}>${escapeHtml(s)}</option>`).join('')}
        <option value="__new__">+ Nuovo cantiere…</option>
      </select>
    </div>
    <div class="field">
      <div class="slider-top"><label style="margin:0">Ore lavorate</label><span class="slider-val f-ore-val">${fmtHrs(site.ore)}</span></div>
      <div class="slider-wrap">
        <input type="range" class="f-ore" min="0" max="9" step="0.5" value="${site.ore}">
      </div>
    </div>
    <div class="field">
      <label>Lavorazioni</label>
      <textarea class="f-lav" placeholder="Descrivi le lavorazioni svolte…">${escapeHtml(site.lavorazioni)}</textarea>
    </div>
    <div class="field" style="margin-bottom:0">
      <label>Materiali e attrezzature</label>
      <textarea class="f-mat" placeholder="Materiali/attrezzature utilizzati…">${escapeHtml(site.materiali)}</textarea>
    </div>
  </div>`;
}

function loadFormFromEntry(id){
  const e = S.entries.find(x=>x.id===id);
  if(!e) return freshForm();
  return { date:e.date, pranzoACasa:e.pranzoACasa, missingType:e.missingType||'', sites: e.sites.map(s=>({...s})) };
}

function renderMain(){
  const f = CURRENT_FORM;
  const editing = !!S.editId;
  const total = f.sites.reduce((a,s)=>a+Number(s.ore||0),0);
  return `
  <div class="topbar">
    <div class="row">
      <div>
        <h1>${editing? 'Modifica registrazione':'Registro Ore'}</h1>
        <div class="sub">Operaio: ${escapeHtml(S.worker)}</div>
      </div>
      <button class="link-btn" id="logout-btn">Cambia utente</button>
    </div>
  </div>
  <div class="content">
    ${editing ? `<div class="warn">Stai modificando una registrazione esistente.</div>` : ''}
    ${S.sites.length===0 ? `<div class="warn">Non ci sono ancora cantieri configurati: creane uno dal menu a tendina qui sotto.</div>` : ''}
    <div class="card">
      <div class="field">
        <label>Data</label>
        <input type="date" id="f-date" value="${f.date}">
      </div>

      <div id="sites-container">
        ${f.sites.map((s,i)=>siteBlockHtml(s,i, f.sites.length>1)).join('')}
      </div>
      <button type="button" class="add-site-btn" id="add-site-btn">+ Aggiungi un altro cantiere</button>

      <div class="total-strip">
        <span class="lbl">Totale ore giorno</span>
        <span class="val mono" id="total-display">${fmtHrs(total)} h</span>
      </div>

      <div id="missing-wrap" class="field" style="${total<8 ? '' : 'display:none'}">
        <label>Le ore mancanti (per arrivare a 8) sono da considerare come</label>
        <select id="f-missing">
          <option value="">Seleziona…</option>
          <option value="ferie" ${f.missingType==='ferie'?'selected':''}>Ferie</option>
          <option value="malattia" ${f.missingType==='malattia'?'selected':''}>Malattia</option>
          <option value="cassa_meteo" ${f.missingType==='cassa_meteo'?'selected':''}>Cassa meteo</option>
        </select>
      </div>

      <div class="field" style="margin-bottom:0">
        <div class="checkrow">
          <input type="checkbox" id="f-pranzo" ${f.pranzoACasa?'checked':''}>
          <label for="f-pranzo">Pranzato a casa</label>
        </div>
      </div>
    </div>
    ${editing ? `<button type="button" class="btn btn-danger btn-block" id="delete-entry-btn" style="margin-bottom:12px">Elimina questa registrazione</button>` : ''}
  </div>

  <div class="actionbar">
    <button class="btn btn-ghost" id="reset-btn">Reset</button>
    <button class="btn btn-ghost" id="visualizza-btn">Visualizza</button>
    <button class="btn btn-primary" id="salva-btn">${editing?'Salva modifiche':'Salva'}</button>
  </div>`;
}

function collectFormFromDom(){
  const date = document.getElementById('f-date').value || todayStr();
  const pranzoACasa = document.getElementById('f-pranzo').checked;
  const missingSel = document.getElementById('f-missing');
  const missingType = missingSel ? missingSel.value : '';
  const blocks = Array.from(document.querySelectorAll('.site-block')).map(b=>({
    cantiere: b.querySelector('.f-cantiere').value,
    ore: Number(b.querySelector('.f-ore').value),
    lavorazioni: b.querySelector('.f-lav').value.trim(),
    materiali: b.querySelector('.f-mat').value.trim()
  }));
  return { date, pranzoACasa, missingType, sites: blocks };
}

function recomputeTotalUI(){
  const blocks = Array.from(document.querySelectorAll('.site-block'));
  let total = 0;
  blocks.forEach(b=>{
    const r = b.querySelector('.f-ore');
    const v = Number(r.value);
    b.querySelector('.f-ore-val').textContent = fmtHrs(v);
    total += v;
  });
  const disp = document.getElementById('total-display');
  if(disp) disp.textContent = fmtHrs(total)+' h';
  const wrap = document.getElementById('missing-wrap');
  if(wrap) wrap.style.display = total < 8 ? '' : 'none';
}

function wireSiteSelect(sel){
  sel.addEventListener('change', function(){
    if(this.value==='__new__'){
      const name = window.prompt('Nome del nuovo cantiere:');
      if(name && name.trim()){
        const clean = name.trim();
        if(!S.sites.includes(clean)){ S.sites.push(clean); apiSave('saveSites', S.sites).catch(()=>{}); }
        document.querySelectorAll('.site-select').forEach(s2=>{
          if(!Array.from(s2.options).some(o=>o.value===clean)){
            const opt = document.createElement('option'); opt.value=clean; opt.textContent=clean;
            s2.insertBefore(opt, s2.lastElementChild);
          }
        });
        this.value = clean;
      } else { this.value = S.sites[0] || ''; }
    }
  });
}

/* ================= VIEW (VISUALIZZAZIONE) ================= */
function renderView(){
  const mine = S.entries.filter(e=>e.worker===S.worker).sort((a,b)=>{
    const d = b.date.localeCompare(a.date);
    if(d !== 0) return d;
    return String(b.updatedAt||'').localeCompare(String(a.updatedAt||''));
  });
  const months = Array.from(new Set(mine.map(e=>monthKey(e.date))));
  const curMonth = monthKey(todayStr());
  if(!months.includes(curMonth)) months.unshift(curMonth);
  months.sort().reverse();
  const selMonth = (S.viewMonth && months.includes(S.viewMonth)) ? S.viewMonth : months[0];
  const filtered = mine.filter(e=>monthKey(e.date)===selMonth);
  const totalMonth = filtered.reduce((a,e)=>a+Number(e.totalOre||0),0);

  return `
  <div class="topbar">
    <div class="row">
      <div><h1>Le mie ore</h1><div class="sub">Operaio: ${escapeHtml(S.worker)}</div></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="refresh-btn" title="Aggiorna dati">🔄</button>
        <button class="link-btn" id="logout-btn">Cambia utente</button>
      </div>
    </div>
  </div>
  <div class="content">
    <div class="month-picker">
      <select id="month-select">
        ${months.map(m=>`<option value="${m}" ${m===selMonth?'selected':''}>${monthLabel(m)}</option>`).join('')}
      </select>
    </div>
    <div class="stamp">
      <div class="n">${fmtHrs(totalMonth)}</div>
      <div class="l">Ore totali</div>
    </div>

    ${filtered.length===0 ? `
      <div class="empty-state">
        <div class="big">🗒️</div>
        Nessuna registrazione per ${monthLabel(selMonth)}.
      </div>` :
      filtered.map(e=>`
      <div class="ticket" data-id="${e.id}">
        <div class="left">
          <span class="date">${fmtDate(e.date)}</span>
          <span class="sites">${escapeHtml(e.sites.map(s=>s.cantiere).join(', '))}</span>
        </div>
        <div class="hrs">${fmtHrs(e.totalOre)} h</div>
      </div>`).join('')
    }
  </div>
  <div class="actionbar">
    <button class="btn btn-ghost" id="exit-btn">Esci</button>
    <button class="btn btn-primary" id="new-entry-btn">+ Nuova voce</button>
  </div>`;
}

/* ================= ADMIN LOGIN ================= */
function renderAdminLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-badge" style="background:var(--ink)">A</div>
      <h1>Amministrazione</h1>
      <div class="login-sub">Accesso riservato</div>

/* ================= ADMIN ================= */
function flattenRows(){
  const rows = [];
  S.entries.forEach(e=>{
    e.sites.forEach(s=>{
      rows.push({
        entryId:e.id, date:e.date, worker:e.worker, cantiere:s.cantiere, ore:Number(s.ore||0),
        pranzo:e.pranzoACasa, missing: e.totalOre<8 ? (MOTIVI[e.missingType]||'') : '',
        lavorazioni:s.lavorazioni, materiali:s.materiali
      });
    });
  });
  return rows.sort((a,b)=> b.date.localeCompare(a.date));
}

function renderAdmin(){
  const tab = S.admin.tab;
  return `
  <div class="topbar">
    <div class="row">
      <div><h1>Amministrazione</h1><div class="sub">Registro ore cantiere</div></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="refresh-btn" title="Aggiorna dati">🔄</button>
        <button class="link-btn" id="admin-logout">Esci</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${tab==='registro'?'active':''}" data-tab="registro">Registro ore</button>
      <button class="tab-btn ${tab==='utenti'?'active':''}" data-tab="utenti">Operai</button>
      <button class="tab-btn ${tab==='cantieri'?'active':''}" data-tab="cantieri">Cantieri</button>
    </div>
  </div>
  <div class="content">
    ${tab==='registro' ? renderAdminRegistro() : tab==='utenti' ? renderAdminUtenti() : renderAdminCantieri()}
  </div>`;
}

  const f = S.admin.filters;
  let rows = flattenRows();
  if(f.worker) rows = rows.filter(r=>r.worker===f.worker);
  if(f.cantiere) rows = rows.filter(r=>r.cantiere===f.cantiere);

  if(f.to) rows = rows.filter(r=>r.date<=f.to);
  const total = rows.reduce((a,r)=>a+r.ore,0);

  return `
  <div class="toolbar">
    <div class="filters" style="flex:1">
      <div>
        <label>Operaio</label>
        <select id="fl-worker">
          <option value="">Tutti</option>
          ${S.workers.map(w=>`<option value="${escapeHtml(w.name)}" ${f.worker===w.name?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Cantiere</label>
        <select id="fl-cantiere">
          <option value="">Tutti</option>
          ${S.sites.map(s=>`<option value="${escapeHtml(s)}" ${f.cantiere===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
        </select>
      </div>

  </div>
  <div class="table-wrap">

      <thead><tr>
        <th>Data</th><th>Operaio</th><th>Cantiere</th><th>Ore</th><th>Pranzo a casa</th><th>Ore mancanti</th><th>Lavorazioni</th><th>Materiali/attrezz.</th>
      </tr></thead>
      <tbody>
        ${rows.length===0 ? `<tr><td colspan="8" style="text-align:center;color:var(--steel);padding:24px">Nessun dato per i filtri selezionati.</td></tr>` :
        rows.map(r=>`<tr>
          <td class="mono">${fmtDate(r.date)}</td>
          <td>${escapeHtml(r.worker)}</td>
          <td>${escapeHtml(r.cantiere)}</td>

function renderAdminUtenti(){
  return `
  <h3 style="margin-top:0">Operai</h3>
  <div id="users-list">
    ${S.workers.map((w,i)=>`
      <div class="userrow" data-idx="${i}">

        <input type="text" class="u-pass" value="${escapeHtml(w.password)}" placeholder="Password">

  return `
  <h3 style="margin-top:0">Cantieri</h3>
  <div id="sites-list">
    ${S.sites.map((s,i)=>`
      <div class="siterow" data-idx="${i}">
        <span>${escapeHtml(s)}</span>

      </div>

  <div class="siterow">

/* ================= EXPORT XLSX ================= */
function exportXlsx(rows){
  const data = rows.map(r=>({
    'Data': fmtDate(r.date), 'Operaio': r.worker, 'Cantiere': r.cantiere, 'Ore': r.ore,
    'Pranzo a casa': r.pranzo?'Sì':'No', 'Ore mancanti': r.missing,
    'Lavorazioni': r.lavorazioni, 'Materiali e attrezzature': r.materiali
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:11},{wch:16},{wch:16},{wch:6},{wch:12},{wch:14},{wch:34},{wch:34}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Registro ore');
  XLSX.writeFile(wb, 'registro-ore.xlsx');
}

/* ================= HANDLERS ================= */
function attachHandlers(){
  if(S.screen==='configerror'){
    const retry = document.getElementById('retry-btn');
    if(retry) retry.addEventListener('click', ()=>{ S.screen='loading'; render(); init(); });
  }

  if(S.screen==='login'){
    const form = document.getElementById('login-form');
    if(form) form.addEventListener('submit', e=>{
      e.preventDefault();
      const name = document.getElementById('login-name').value;
      const pass = document.getElementById('login-pass').value;
      const w = S.workers.find(w=>w.name===name);
      if(w && w.password===pass){
        S.worker = name; S.loginErr='';
        setSession({name});
        goto('main');
      } else {
        S.loginErr = "Nome o password non corretti. Contatta l'amministratore.";
        render();
      }
    });
    document.getElementById('go-admin').addEventListener('click', ()=>{ S.adminErr=''; goto('adminlogin'); });
  }

  if(S.screen==='main'){
    document.getElementById('logout-btn').addEventListener('click', ()=>{
      clearSession(); S.worker=null; S.editId=null; CURRENT_FORM=null; goto('login');
    });
    document.querySelectorAll('.f-ore').forEach(r=> r.addEventListener('input', recomputeTotalUI));
    document.querySelectorAll('.site-select').forEach(wireSiteSelect);
    document.getElementById('add-site-btn').addEventListener('click', ()=>{
      const container = document.getElementById('sites-container');
      const idx = document.querySelectorAll('.site-block').length;
      container.insertAdjacentHTML('beforeend', siteBlockHtml({cantiere:S.sites[0]||'', ore:0, lavorazioni:'', materiali:''}, idx, true));
      const newBlock = container.lastElementChild;
      newBlock.querySelector('.f-ore').addEventListener('input', recomputeTotalUI);
      wireSiteSelect(newBlock.querySelector('.site-select'));
      newBlock.querySelector('.remove-block').addEventListener('click', ()=>{ newBlock.remove(); recomputeTotalUI(); });
      recomputeTotalUI();
    });
    document.querySelectorAll('.remove-block').forEach(btn=> btn.addEventListener('click', function(){
      this.closest('.site-block').remove(); recomputeTotalUI();
    }));

    document.getElementById('reset-btn').addEventListener('click', ()=>{
      S.editId = null; CURRENT_FORM = freshForm(); render();
    });
    document.getElementById('visualizza-btn').addEventListener('click', ()=>{
      S.editId = null; CURRENT_FORM = null; goto('view');
    });
    const delBtn = document.getElementById('delete-entry-btn');
    if(delBtn) delBtn.addEventListener('click', async ()=>{
      if(window.confirm('Eliminare definitivamente questa registrazione?')){
        S.entries = S.entries.filter(e=>e.id!==S.editId);
        try{ await apiSave('saveEntries', S.entries); }catch(err){ alert('Errore nel salvataggio: '+err.message); }
        S.editId = null; CURRENT_FORM = null; goto('view');
      }
    });
    document.getElementById('salva-btn').addEventListener('click', async ()=>{
      const data = collectFormFromDom();
      if(!data.sites.length || data.sites.some(s=>!s.cantiere)){
        alert('Seleziona un cantiere per ogni riga.'); return;
      }
      const total = data.sites.reduce((a,s)=>a+s.ore,0);
      if(total < 8 && !data.missingType){
        alert('Indica il motivo delle ore mancanti (Ferie / Malattia / Cassa meteo).'); return;
      }
      const entry = {
        id: S.editId || uid(),
        worker: S.worker,
        date: data.date,
        pranzoACasa: data.pranzoACasa,
        missingType: total < 8 ? data.missingType : '',
        sites: data.sites,
        totalOre: total,
        updatedAt: new Date().toISOString()
      };
      if(S.editId){
        const i = S.entries.findIndex(e=>e.id===S.editId);
        if(i>-1) S.entries[i] = entry; else S.entries.push(entry);
      } else {
        S.entries.push(entry);
      }
      const btn = document.getElementById('salva-btn');
      btn.disabled = true; btn.textContent = 'Salvataggio…';
      try{
        await apiSave('saveEntries', S.entries);
      }catch(err){
        alert('Errore nel salvataggio: ' + err.message);
        btn.disabled = false; btn.textContent = S.editId ? 'Salva modifiche' : 'Salva';
        return;
      }
      S.viewMonth = monthKey(entry.date);
      S.editId = null; CURRENT_FORM = null;
      goto('view');
    });
  }

  if(S.screen==='view'){
    document.getElementById('logout-btn').addEventListener('click', ()=>{
      clearSession(); S.worker=null; goto('login');
    });
    document.getElementById('refresh-btn').addEventListener('click', async ()=>{ await refreshData(); render(); });
    document.getElementById('month-select').addEventListener('change', function(){ S.viewMonth = this.value; render(); });
    document.querySelectorAll('.ticket').forEach(t=> t.addEventListener('click', function(){
      S.editId = this.dataset.id; CURRENT_FORM = null; goto('main');
    }));
    document.getElementById('new-entry-btn').addEventListener('click', ()=>{
      S.editId = null; CURRENT_FORM = freshForm(); goto('main');
    });
    document.getElementById('exit-btn').addEventListener('click', ()=>{
      clearSession(); S.worker=null; goto('login');
    });
  }

  if(S.screen==='adminlogin'){
    document.getElementById('admin-login-form').addEventListener('submit', e=>{
      e.preventDefault();
      const u = document.getElementById('admin-user').value;
      const p = document.getElementById('admin-pass').value;
      if(u===ADMIN_USER && p===ADMIN_PASS){ S.admin.loggedIn=true; S.adminErr=''; goto('admin'); }
      else { S.adminErr='Credenziali non valide.'; render(); }
    });
    document.getElementById('back-to-login').addEventListener('click', ()=> goto('login'));
  }

  if(S.screen==='admin'){
    document.getElementById('admin-logout').addEventListener('click', ()=>{ S.admin.loggedIn=false; goto('login'); });
    document.getElementById('refresh-btn').addEventListener('click', async ()=>{ await refreshData(); render(); });
    document.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', function(){ S.admin.tab=this.dataset.tab; render(); }));

    if(S.admin.tab==='registro'){
      document.getElementById('fl-worker').addEventListener('change', function(){ S.admin.filters.worker=this.value; render(); });
      document.getElementById('fl-cantiere').addEventListener('change', function(){ S.admin.filters.cantiere=this.value; render(); });
      document.getElementById('fl-from').addEventListener('change', function(){ S.admin.filters.from=this.value; render(); });
      document.getElementById('fl-to').addEventListener('change', function(){ S.admin.filters.to=this.value; render(); });
      document.getElementById('export-btn').addEventListener('click', ()=>{
        const f = S.admin.filters;
        let rows = flattenRows();
        if(f.worker) rows = rows.filter(r=>r.worker===f.worker);
        if(f.cantiere) rows = rows.filter(r=>r.cantiere===f.cantiere);
        if(f.from) rows = rows.filter(r=>r.date>=f.from);
        if(f.to) rows = rows.filter(r=>r.date<=f.to);
        exportXlsx(rows);
      });
    }

    if(S.admin.tab==='utenti'){
      document.querySelectorAll('.userrow').forEach(row=>{
        if(row.dataset.idx===undefined) return;
        const idx = Number(row.dataset.idx);
        const saveBtn = row.querySelector('.u-save');
        const delBtn = row.querySelector('.u-del');
        if(saveBtn) saveBtn.addEventListener('click', async ()=>{
          const name = row.querySelector('.u-name').value.trim();
          const pass = row.querySelector('.u-pass').value.trim();
          if(!name || !pass){ alert('Nome e password sono obbligatori.'); return; }
          S.workers[idx] = { name, password: pass };
          try{ await apiSave('saveWorkers', S.workers); }catch(err){ alert('Errore: '+err.message); }
          render();
        });
        if(delBtn) delBtn.addEventListener('click', async ()=>{
          if(window.confirm('Eliminare questo operaio? Le registrazioni già salvate resteranno nel registro.')){
            S.workers.splice(idx,1);
            try{ await apiSave('saveWorkers', S.workers); }catch(err){ alert('Errore: '+err.message); }
            render();
          }
        });
      });
      document.getElementById('add-user-btn').addEventListener('click', async ()=>{
        const name = document.getElementById('new-u-name').value.trim();
        const pass = document.getElementById('new-u-pass').value.trim();
        if(!name || !pass){ alert('Inserisci nome e password.'); return; }
        if(S.workers.some(w=>w.name.toLowerCase()===name.toLowerCase())){ alert('Esiste già un operaio con questo nome.'); return; }
        S.workers.push({name, password:pass});
        try{ await apiSave('saveWorkers', S.workers); }catch(err){ alert('Errore: '+err.message); }
        render();
      });
    }

    if(S.admin.tab==='cantieri'){
      document.querySelectorAll('.siterow').forEach(row=>{
        if(row.dataset.idx===undefined) return;
        const idx = Number(row.dataset.idx);
        const delBtn = row.querySelector('.s-del');
        if(delBtn) delBtn.addEventListener('click', async ()=>{
          if(window.confirm('Eliminare questo cantiere dalla lista?')){
            S.sites.splice(idx,1);
            try{ await apiSave('saveSites', S.sites); }catch(err){ alert('Errore: '+err.message); }
            render();
          }
        });
      });
      document.getElementById('add-site-admin-btn').addEventListener('click', async ()=>{
        const name = document.getElementById('new-site-name').value.trim();
        if(!name){ return; }
        if(S.sites.includes(name)){ alert('Cantiere già presente.'); return; }
        S.sites.push(name);
        try{ await apiSave('saveSites', S.sites); }catch(err){ alert('Errore: '+err.message); }
        render();
      });
    }
  }
}

init();
</script>
