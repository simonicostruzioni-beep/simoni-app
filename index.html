<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Impresa Simoni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2421;
    --steel:#4A5049;
    --concrete:#E4E0D6;
    --paper:#FBF9F4;
    --orange:#E8590C;
    --orange-dark:#C44A08;
    --green:#4C7A52;
    --red:#B23A2E;
    --border:#CFC9B8;
    --border-soft:#E2DDCF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--concrete);color:var(--ink);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--concrete);padding-bottom:30px;position:relative;}

  .topbar{background:var(--ink);color:var(--paper);padding:18px 20px 16px;position:sticky;top:0;z-index:20;}
  .topbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar h1{font-size:19px;margin:0;color:#fff;}
  .topbar .sub{font-size:12px;color:#C9C4B4;margin-top:2px;letter-spacing:.02em;text-transform:none;font-family:'Inter',sans-serif;}
  .icon-btn{background:none;border:1px solid #444943;color:#fff;border-radius:6px;padding:7px 10px;font-size:15px;cursor:pointer;}

  .content{padding:20px;}
  .card{background:var(--paper);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--steel);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  input[type=text], input[type=number], input[type=password], input[type=date], select, textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:15.5px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:var(--orange);}
  .field{margin-bottom:14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;padding:13px 18px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;transition:transform .06s ease;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--border);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:12.5px;}
  .err{background:#FBEAE7;border:1px solid var(--red);color:var(--red);padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:14px;}
  .hint{font-size:12px;color:var(--steel);margin-top:4px;}

  .login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--paper);border-radius:14px;padding:32px 26px;width:100%;max-width:380px;border:1px solid var(--border-soft);box-shadow:0 12px 30px rgba(31,36,33,.12);}
  .login-badge{width:56px;height:56px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff;font-family:'Oswald';font-weight:700;font-size:22px;}
  .login-card h1{text-align:center;font-size:22px;margin:0 0 4px;}
  .login-sub{text-align:center;color:var(--steel);font-size:13.5px;margin-bottom:22px;}

  /* HOME */
  .home-btn{display:flex;align-items:center;gap:16px;background:var(--paper);border:1.5px solid var(--border-soft);border-radius:14px;padding:20px;margin-bottom:14px;cursor:pointer;text-align:left;width:100%;}
  .home-btn:active{transform:scale(.98);}
  .home-btn .ic{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
  .home-btn.a .ic{background:#FFF0E4;}
  .home-btn.b .ic{background:#E9F2EA;}
  .home-btn.c .ic{background:#EAEEF7;}
  .home-btn .txt h3{margin:0 0 3px;font-size:16px;}
  .home-btn .txt p{margin:0;font-size:12.5px;color:var(--steel);font-family:'Inter';text-transform:none;letter-spacing:0;}

  /* CANTIERI grid */
  .site-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .site-card{background:var(--paper);border:1.5px solid var(--border-soft);border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;}
  .site-card:active{transform:scale(.97);}
  .site-card .ic{font-size:26px;margin-bottom:8px;}
  .site-card .name{font-family:'Oswald';font-weight:600;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em;}
  .add-site-tile{border:1.5px dashed var(--orange);color:var(--orange-dark);background:#FFF4EC;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;padding:18px 12px;cursor:pointer;}

  /* checklist operai */
  .op-row{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .op-row .head{display:flex;align-items:center;gap:10px;}
  .op-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--orange);flex-shrink:0;}
  .op-row .name{flex:1;font-weight:600;font-size:14.5px;}
  .op-row .ore-slider-wrap{display:none;align-items:center;gap:10px;width:100%;margin-top:12px;padding-top:2px;}
  .op-row:not(.off) .ore-slider-wrap{display:flex;}
  .op-row .ore-slider{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:4px;background:var(--border);outline:none;}
  .op-row .ore-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;}
  .op-row .ore-slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer;border:none;}
  .op-row .ore-val{font-weight:700;font-size:14px;min-width:34px;text-align:right;color:var(--orange-dark);}

  /* timeline note */
  .note-item{background:#fff;border:1px solid var(--border-soft);border-radius:10px;padding:14px;margin-bottom:12px;}
  .note-item .date{font-family:'JetBrains Mono';font-size:11.5px;color:var(--steel);margin-bottom:6px;}
  .note-item .txt{font-size:14.5px;line-height:1.45;white-space:pre-wrap;margin-bottom:10px;}
  .note-item .txt:last-child{margin-bottom:0;}
  .photo-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .photo-strip img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--border-soft);}
  .audio-item{width:100%;margin-bottom:6px;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--steel);}
  .empty-state .big{font-size:34px;margin-bottom:8px;}

  /* composer nota */
  .stage-photo{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--border-soft);}
  .stage-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .stage-photo .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer;}
  .rec-row{display:flex;align-items:center;gap:10px;}
  .rec-dot{width:11px;height:11px;border-radius:50%;background:var(--red);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .attach-bar{display:flex;gap:8px;margin-bottom:14px;}
  .attach-bar .btn{flex:1;}

  /* quaderno */
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .filters > div{flex:1;min-width:130px;}
  .ticket{background:#fff;border:1px solid var(--border-soft);border-radius:6px;padding:10px 12px 10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;overflow:hidden;}
  .ticket::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange);}
  .ticket .main{flex:1;min-width:0;cursor:pointer;}
  .ticket .date{font-family:'JetBrains Mono';font-weight:700;font-size:12.5px;}
  .ticket .site{font-size:12.5px;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ticket .hrs{font-family:'JetBrains Mono';font-weight:700;font-size:13.5px;color:var(--orange-dark);flex-shrink:0;}
  .ticket .del{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0;}

  .fab{position:fixed;bottom:24px;left:50%;transform:translateX(calc(-50% + 210px));width:56px;height:56px;border-radius:50%;background:var(--orange);color:#fff;border:none;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;z-index:25;}
  @media (max-width:560px){ .fab{ left:auto; right:20px; transform:none; } }

  .back-link{background:none;border:none;color:var(--paper);font-family:'Inter';font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:2px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= CONFIGURAZIONE ================= */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbweWXQHAzzw1wWo9p-oSY01E_qqnqc1Z7jW_Gn4RTKBq390Vw7LwAh93K-ZGwaCBD2-eg/exec';
const APP_PASSWORD = 'simoni2026'; // password unica per capocantiere/amministratore
const SESSION_KEY = 'is_session_v1';

/* ================= STATO ================= */
let S = {
  screen: 'login',
  authed: false,
  workers: [],
  sites: [],
  entries: [],
  notes: [],
  media: [],
  loading: false,
  error: '',
  editEntryId: null,
  selectedCantiere: null,
  quadFilters: { cantiere: '', operaio: '', from: '', to: '' }
};

let FORM = null;       // stato form giornata in corso
let NOTE_DRAFT = null; // stato composer nota in corso
let MEDIA_REC = { recorder: null, chunks: [], stream: null, recording: false, audioBlob: null, audioUrl: null };

/* ================= API ================= */
async function apiCall(action, data) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action, data })
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}
async function refreshData() {
  S.loading = true; render();
  try {
    const data = await apiCall('getAll');
    S.workers = data.workers || [];
    S.sites = data.sites || [];
    S.entries = data.entries || [];
    S.notes = data.notes || [];
    S.media = data.media || [];
  } catch (err) {
    S.error = 'Errore nel caricamento dati: ' + err.message;
  }
  S.loading = false; render();
}
async function saveEntriesRemote() { await apiCall('saveEntries', S.entries); }
async function saveNotesRemote() { await apiCall('saveNotes', S.notes); }
async function saveSitesRemote() { await apiCall('saveSites', S.sites); }

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
/* Ridimensiona e comprime una foto prima di spedirla, per velocizzare drasticamente l'upload */
function compressImage(file, maxDim = 1600, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Compressione immagine fallita')), 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadMediaRemote(cantiere, noteId, tipo, filename, mimeType, base64) {
  return apiCall('uploadMedia', { cantiere, noteId, tipo, filename, mimeType, base64 });
}

/* ================= UTIL ================= */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function uid(prefix) {
  return prefix + '_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function goto(screen) { S.screen = screen; S.error = ''; render(); window.scrollTo(0, 0); }

function clearSession() { localStorage.removeItem(SESSION_KEY); }
function hasSession() { return localStorage.getItem(SESSION_KEY) === '1'; }

/* ================= FORM GIORNATA ================= */
function freshGiornataForm() {
  const operai = {};
  S.workers.forEach(w => { operai[w] = { presente: false, ore: 8 }; });
  return { date: todayStr(), cantiere: S.sites[0] || '', lavorazioni: '', materiali: '', operai };
}
function loadGiornataForm(entry) {
  const operai = {};
  S.workers.forEach(w => { operai[w] = { presente: false, ore: 8 }; });
  (entry.operai || []).forEach(o => { operai[o.nome] = { presente: true, ore: o.ore }; });
  return { date: entry.date, cantiere: entry.cantiere, lavorazioni: entry.lavorazioni, materiali: entry.materiali, operai };
}

/* ================= RENDER ================= */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = renderScreen();
  bindEvents();
}

function renderScreen() {
  if (S.screen === 'login') return screenLogin();
  if (S.screen === 'home') return screenHome();
  if (S.screen === 'giornata') return screenGiornata();
  if (S.screen === 'cantieri') return screenCantieri();
  if (S.screen === 'cantiere') return screenCantiereDetail();
  if (S.screen === 'nota') return screenNota();
  if (S.screen === 'quaderno') return screenQuaderno();
  return '<div class="content">Schermata non trovata.</div>';
}

function topbar(title, sub, showBack) {
  const subText = S.loading ? 'Aggiornamento dati…' : sub;
  return `
  <div class="topbar">
    <div class="row">
      <div>
        ${showBack ? `<button class="back-link" id="back-btn">&larr; Indietro</button>` : ''}
        <h1>${escapeHtml(title)}</h1>
        ${subText ? `<div class="sub">${escapeHtml(subText)}</div>` : ''}
      </div>
      <button class="icon-btn" id="refresh-btn" title="Aggiorna" ${S.loading ? 'disabled' : ''}>&#8635;</button>
    </div>
  </div>`;
}

function screenLoadingShell() {
  return `${topbar('Impresa Simoni', 'Caricamento dati…')}<div class="content"><div class="empty-state"><div class="big">&#9203;</div>Caricamento in corso…</div></div>`;
}

function screenLogin() {
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-badge">IS</div>
      <h1>Impresa Simoni</h1>
      <div class="login-sub">Accesso riservato a capocantiere e amministratore</div>
      ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
      <form id="login-form">
        <div class="field">
          <label>Password</label>
          <input type="password" id="login-pass" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entra</button>
      </form>
    </div>
  </div>`;
}

function screenHome() {
  return `
  ${topbar('Impresa Simoni', 'Cosa vuoi fare?')}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    <button class="home-btn a" id="go-giornata">
      <div class="ic">&#128203;</div>
      <div class="txt"><h3>Inserisci giornata</h3><p>Ore lavorate, cantiere e lavorazioni di oggi</p></div>
    </button>
    <button class="home-btn b" id="go-cantieri">
      <div class="ic">&#127959;&#65039;</div>
      <div class="txt"><h3>Cantieri</h3><p>Note, foto e audio per ciascun cantiere</p></div>
    </button>
    <button class="home-btn c" id="go-quaderno">
      <div class="ic">&#128214;</div>
      <div class="txt"><h3>Quaderno cantieri</h3><p>Storico giornate, filtri, modifica</p></div>
    </button>
  </div>`;
}

function screenGiornata() {
  if (!FORM) FORM = S.editEntryId ? loadGiornataForm(S.entries.find(e => e.id === S.editEntryId)) : freshGiornataForm();
  S.workers.forEach(w => { if (!FORM.operai[w]) FORM.operai[w] = { presente: false, ore: 8 }; });
  if (!FORM.cantiere && S.sites.length) FORM.cantiere = S.sites[0];
  const isEdit = !!S.editEntryId;
  const opRows = S.workers.map(w => {
    const st = FORM.operai[w] || { presente: false, ore: 8 };
    return `
    <div class="op-row ${st.presente ? '' : 'off'}" data-worker="${escapeHtml(w)}">
      <div class="head">
        <input type="checkbox" class="op-check" ${st.presente ? 'checked' : ''}>
        <div class="name">${escapeHtml(w)}</div>
        <div class="ore-val mono">${st.ore}h</div>
      </div>
      <div class="ore-slider-wrap">
        <input type="range" class="ore-slider op-ore" min="1" max="9.5" step="0.5" value="${st.ore}">
      </div>
    </div>`;
  }).join('');

  return `
  ${topbar(isEdit ? 'Modifica giornata' : 'Inserisci giornata', '', true)}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    <div class="card">
      <div class="field">
        <label>Data</label>
        <input type="date" id="f-date" value="${FORM.date}">
      </div>
      <div class="field">
        <label>Cantiere</label>
        <select id="f-cantiere">
          ${S.sites.map(s => `<option value="${escapeHtml(s)}" ${s === FORM.cantiere ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
        </select>
        <div class="hint">Non trovi il cantiere? <a href="#" id="f-new-site">Aggiungine uno nuovo</a></div>
      </div>
      <div class="field">
        <label>Operai presenti e ore</label>
        ${S.workers.length ? opRows : `<div class="hint">Nessun operaio configurato: aggiungili dalla pagina Admin.</div>`}
      </div>
      <div class="field">
        <label>Lavorazioni effettuate</label>
        <textarea id="f-lavorazioni" placeholder="Es. scavo fondazioni, posa tubi...">${escapeHtml(FORM.lavorazioni)}</textarea>
      </div>
      <div class="field">
        <label>Materiali utilizzati</label>
        <textarea id="f-materiali" placeholder="Es. 20 sacchi cemento, tubi PVC...">${escapeHtml(FORM.materiali)}</textarea>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="save-giornata-btn">${isEdit ? 'Salva modifiche' : 'Salva giornata'}</button>
    ${isEdit ? `<button class="btn btn-danger btn-block" id="delete-giornata-btn" style="margin-top:10px;">Elimina giornata</button>` : ''}
  </div>`;
}

function screenCantieri() {
  const tiles = S.sites.map(s => `
    <div class="site-card" data-site="${escapeHtml(s)}">
      <div class="ic">&#127959;&#65039;</div>
      <div class="name">${escapeHtml(s)}</div>
    </div>`).join('');
  return `
  ${topbar('Cantieri', 'Seleziona un cantiere', true)}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    <div class="site-grid">
      ${tiles}
      <div class="add-site-tile" id="add-site-tile">
        <div class="ic">&#65291;</div>
        <div class="name">Nuovo cantiere</div>
      </div>
    </div>
  </div>`;
}

function screenCantiereDetail() {
  const site = S.selectedCantiere;
  const notes = S.notes.filter(n => n.cantiere === site).sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  const items = notes.map(n => {
    const photos = S.media.filter(m => m.noteId === n.id && m.tipo === 'foto');
    const audios = S.media.filter(m => m.noteId === n.id && m.tipo === 'audio');
    return `
    <div class="note-item">
      <div class="date">${fmtDate(n.date)}</div>
      ${n.testo ? `<div class="txt">${escapeHtml(n.testo)}</div>` : ''}
      ${photos.length ? `<div class="photo-strip">${photos.map(p => `<img src="${p.url}" alt="foto">`).join('')}</div>` : ''}
      ${audios.map(a => `<audio class="audio-item" controls src="${a.url}"></audio>`).join('')}
    </div>`;
  }).join('');

  return `
  ${topbar(site, 'Note, foto e audio', true)}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    ${notes.length ? items : `<div class="empty-state"><div class="big">&#128221;</div>Nessuna nota per questo cantiere.<br>Tocca + per aggiungerne una.</div>`}
  </div>
  <button class="fab" id="add-note-fab" title="Aggiungi nota">&#65291;</button>`;
}

function screenNota() {
  if (!NOTE_DRAFT) NOTE_DRAFT = { photos: [] };
  const audioPreview = MEDIA_REC.audioUrl
    ? `<audio class="audio-item" controls src="${MEDIA_REC.audioUrl}"></audio>
       <button class="btn btn-ghost btn-sm" id="discard-audio-btn">Elimina registrazione</button>`
    : '';
  const recControls = MEDIA_REC.recording
    ? `<div class="rec-row"><span class="rec-dot"></span> Registrazione in corso… <button class="btn btn-danger btn-sm" id="stop-rec-btn">Ferma</button></div>`
    : `<button class="btn btn-ghost btn-block" id="start-rec-btn">&#127908; Registra nota audio</button>`;

  const photosStage = NOTE_DRAFT.photos.map((p, i) => `
    <div class="stage-photo">
      <img src="${p.previewUrl}">
      <button class="rm" data-idx="${i}">&times;</button>
    </div>`).join('');

  return `
  ${topbar('Nuova nota', S.selectedCantiere, true)}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    <div class="card">
      <div class="field">
        <label>Nota / commento</label>
        <textarea id="n-testo" placeholder="Scrivi qui informazioni, osservazioni, aggiornamenti...">${escapeHtml(NOTE_DRAFT.testo || '')}</textarea>
      </div>
      <div class="field">
        <label>Foto</label>
        <div class="photo-strip" id="photo-stage">${photosStage}</div>
        <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none">
        <button class="btn btn-ghost btn-block" id="add-photo-btn">&#128247; Aggiungi foto</button>
      </div>
      <div class="field">
        <label>Nota audio</label>
        ${recControls}
        ${audioPreview}
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="save-note-btn" ${S.savingNote ? 'disabled' : ''}>${S.savingNote ? escapeHtml(S.savingLabel || 'Salvataggio…') : 'Salva nota'}</button>
  </div>`;
}

function screenQuaderno() {
  const f = S.quadFilters;
  let rows = S.entries.slice();
  if (f.cantiere) rows = rows.filter(e => e.cantiere === f.cantiere);
  if (f.operaio) rows = rows.filter(e => (e.operai || []).some(o => o.nome === f.operaio));
  if (f.from) rows = rows.filter(e => e.date >= f.from);
  if (f.to) rows = rows.filter(e => e.date <= f.to);
  rows.sort((a, b) => b.date.localeCompare(a.date));

  const tickets = rows.map(e => {
    const tot = (e.operai || []).reduce((s, o) => s + (Number(o.ore) || 0), 0);
    return `
    <div class="ticket">
      <div class="main" data-id="${e.id}">
        <div class="date mono">${fmtDate(e.date)}</div>
        <div class="site">${escapeHtml(e.cantiere)}</div>
      </div>
      <div class="hrs mono">${tot}h</div>
      <button class="del" data-id="${e.id}" title="Elimina">&#128465;</button>
    </div>`;
  }).join('');

  return `
  ${topbar('Quaderno cantieri', 'Storico giornate', true)}
  <div class="content">
    ${S.error ? `<div class="err">${escapeHtml(S.error)}</div>` : ''}
    <div class="filters">
      <div>
        <label>Cantiere</label>
        <select id="qf-cantiere">
          <option value="">Tutti</option>
          ${S.sites.map(s => `<option value="${escapeHtml(s)}" ${f.cantiere === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Operaio</label>
        <select id="qf-operaio">
          <option value="">Tutti</option>
          ${S.workers.map(w => `<option value="${escapeHtml(w)}" ${f.operaio === w ? 'selected' : ''}>${escapeHtml(w)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Da</label>
        <input type="date" id="qf-from" value="${f.from}">
      </div>
      <div>
        <label>A</label>
        <input type="date" id="qf-to" value="${f.to}">
      </div>
    </div>
    ${rows.length ? tickets : `<div class="empty-state"><div class="big">&#128203;</div>Nessuna giornata trovata.</div>`}
  </div>`;
}

/* ================= EVENTI ================= */
function bindEvents() {
  const backBtn = document.getElementById('back-btn');
  if (backBtn) backBtn.addEventListener('click', () => {
    if (S.screen === 'cantiere') { goto('cantieri'); return; }
    if (S.screen === 'nota') { NOTE_DRAFT = null; resetRecorder(); goto('cantiere'); return; }
    if (S.screen === 'giornata') { FORM = null; S.editEntryId = null; goto('home'); return; }
    goto('home');
  });
  const refreshBtn = document.getElementById('refresh-btn');
  if (refreshBtn) refreshBtn.addEventListener('click', refreshData);

  if (S.screen === 'login') {
    document.getElementById('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const p = document.getElementById('login-pass').value;
      if (p === APP_PASSWORD) {
        localStorage.setItem(SESSION_KEY, '1');
        S.authed = true; S.error = '';
        goto('home');
        refreshData();
      } else {
        S.error = 'Password non corretta.'; render();
      }
    });
  }

  if (S.screen === 'home') {
    document.getElementById('go-giornata').addEventListener('click', () => { FORM = null; S.editEntryId = null; goto('giornata'); });
    document.getElementById('go-cantieri').addEventListener('click', () => goto('cantieri'));
    document.getElementById('go-quaderno').addEventListener('click', () => goto('quaderno'));
  }

  if (S.screen === 'giornata') bindGiornataEvents();
  if (S.screen === 'cantieri') bindCantieriEvents();
  if (S.screen === 'cantiere') bindCantiereDetailEvents();
  if (S.screen === 'nota') bindNotaEvents();
  if (S.screen === 'quaderno') bindQuadernoEvents();
}

function bindGiornataEvents() {
  document.querySelectorAll('.op-row').forEach(row => {
    const worker = row.dataset.worker;
    const check = row.querySelector('.op-check');
    const slider = row.querySelector('.op-ore');
    const valEl = row.querySelector('.ore-val');
    check.addEventListener('change', () => {
      FORM.operai[worker].presente = check.checked;
      row.classList.toggle('off', !check.checked);
    });
    slider.addEventListener('input', () => {
      FORM.operai[worker].ore = Number(slider.value);
      valEl.textContent = Number(slider.value) + 'h';
    });
  });
  document.getElementById('f-new-site').addEventListener('click', async e => {
    e.preventDefault();
    const name = window.prompt('Nome del nuovo cantiere:');
    if (!name || !name.trim()) return;
    if (S.sites.includes(name.trim())) { alert('Cantiere già presente.'); return; }
    S.sites.push(name.trim());
    FORM.cantiere = name.trim();
    try { await saveSitesRemote(); } catch (err) { alert('Errore salvataggio cantiere: ' + err.message); }
    render();
  });
  document.getElementById('save-giornata-btn').addEventListener('click', async () => {
    FORM.date = document.getElementById('f-date').value || todayStr();
    FORM.cantiere = document.getElementById('f-cantiere').value;
    FORM.lavorazioni = document.getElementById('f-lavorazioni').value;
    FORM.materiali = document.getElementById('f-materiali').value;
    const operaiList = Object.keys(FORM.operai).filter(w => FORM.operai[w].presente).map(w => ({ nome: w, ore: FORM.operai[w].ore }));
    if (!FORM.cantiere) { alert('Seleziona un cantiere.'); return; }
    if (!operaiList.length) { alert('Seleziona almeno un operaio presente.'); return; }

    const entry = {
      id: S.editEntryId || uid('e'),
      date: FORM.date, cantiere: FORM.cantiere,
      lavorazioni: FORM.lavorazioni, materiali: FORM.materiali,
      operai: operaiList, updatedAt: new Date().toISOString()
    };
    const btn = document.getElementById('save-giornata-btn');
    btn.disabled = true; btn.textContent = 'Salvataggio…';
    if (S.editEntryId) {
      const idx = S.entries.findIndex(x => x.id === S.editEntryId);
      if (idx >= 0) S.entries[idx] = entry; else S.entries.push(entry);
    } else {
      S.entries.push(entry);
    }
    try {
      await saveEntriesRemote();
      FORM = null; S.editEntryId = null;
      goto('quaderno');
    } catch (err) {
      alert('Errore nel salvataggio: ' + err.message);
      btn.disabled = false; btn.textContent = 'Salva giornata';
    }
  });
  const delBtn = document.getElementById('delete-giornata-btn');
  if (delBtn) delBtn.addEventListener('click', async () => {
    if (!window.confirm('Eliminare definitivamente questa giornata?')) return;
    S.entries = S.entries.filter(e => e.id !== S.editEntryId);
    try { await saveEntriesRemote(); } catch (err) { alert('Errore: ' + err.message); }
    FORM = null; S.editEntryId = null;
    goto('quaderno');
  });
}

function bindCantieriEvents() {
  document.querySelectorAll('.site-card').forEach(el => {
    el.addEventListener('click', () => { S.selectedCantiere = el.dataset.site; goto('cantiere'); });
  });
  document.getElementById('add-site-tile').addEventListener('click', async () => {
    const name = window.prompt('Nome del nuovo cantiere:');
    if (!name || !name.trim()) return;
    if (S.sites.includes(name.trim())) { alert('Cantiere già presente.'); return; }
    S.sites.push(name.trim());
    try { await saveSitesRemote(); } catch (err) { alert('Errore: ' + err.message); }
    render();
  });
}

function bindCantiereDetailEvents() {
  document.getElementById('add-note-fab').addEventListener('click', () => {
    NOTE_DRAFT = { photos: [] };
    resetRecorder();
    goto('nota');
  });
}

function resetRecorder() {
  if (MEDIA_REC.stream) MEDIA_REC.stream.getTracks().forEach(t => t.stop());
  MEDIA_REC = { recorder: null, chunks: [], stream: null, recording: false, audioBlob: null, audioUrl: null };
}

function bindNotaEvents() {
  document.getElementById('n-testo').addEventListener('input', e => { NOTE_DRAFT.testo = e.target.value; });

  document.getElementById('add-photo-btn').addEventListener('click', () => {
    document.getElementById('photo-input').click();
  });
  document.getElementById('photo-input').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const previewUrl = URL.createObjectURL(file);
    NOTE_DRAFT.photos.push({ file, previewUrl });
    e.target.value = '';
    render();
  });
  document.querySelectorAll('#photo-stage .rm').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      NOTE_DRAFT.photos.splice(idx, 1);
      render();
    });
  });

  const startBtn = document.getElementById('start-rec-btn');
  if (startBtn) startBtn.addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      MEDIA_REC.stream = stream;
      const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
      const recorder = new MediaRecorder(stream, { mimeType });
      MEDIA_REC.recorder = recorder;
      MEDIA_REC.chunks = [];
      recorder.ondataavailable = ev => { if (ev.data.size > 0) MEDIA_REC.chunks.push(ev.data); };
      recorder.onstop = () => {
        const blob = new Blob(MEDIA_REC.chunks, { type: mimeType });
        MEDIA_REC.audioBlob = blob;
        MEDIA_REC.audioUrl = URL.createObjectURL(blob);
        MEDIA_REC.recording = false;
        stream.getTracks().forEach(t => t.stop());
        render();
      };
      recorder.start();
      MEDIA_REC.recording = true;
      render();
    } catch (err) {
      alert('Impossibile accedere al microfono: ' + err.message);
    }
  });
  const stopBtn = document.getElementById('stop-rec-btn');
  if (stopBtn) stopBtn.addEventListener('click', () => { MEDIA_REC.recorder.stop(); });
  const discardBtn = document.getElementById('discard-audio-btn');
  if (discardBtn) discardBtn.addEventListener('click', () => { MEDIA_REC.audioBlob = null; MEDIA_REC.audioUrl = null; render(); });

  document.getElementById('save-note-btn').addEventListener('click', saveNoteAndMedia);
}

async function saveNoteAndMedia() {
  const testo = (NOTE_DRAFT.testo || '').trim();
  const nPhotos = NOTE_DRAFT.photos.length;
  const hasAudio = !!MEDIA_REC.audioBlob;
  if (!testo && !nPhotos && !hasAudio) {
    alert('Aggiungi almeno un testo, una foto o una nota audio.');
    return;
  }
  S.savingNote = true; S.savingLabel = 'Salvataggio nota…'; render();
  const note = { id: uid('n'), cantiere: S.selectedCantiere, date: todayStr(), testo, updatedAt: new Date().toISOString() };
  try {
    S.notes.push(note);
    await apiCall('appendNote', note); // aggiunge solo questa riga, non riscrive tutto il foglio

    if (nPhotos || hasAudio) {
      S.savingLabel = `Caricamento allegati (0/${nPhotos + (hasAudio ? 1 : 0)})…`; render();
      let done = 0;
      const bump = () => { done++; S.savingLabel = `Caricamento allegati (${done}/${nPhotos + (hasAudio ? 1 : 0)})…`; render(); };

      const photoUploads = NOTE_DRAFT.photos.map(async p => {
        const compressed = await compressImage(p.file);
        const base64 = await blobToBase64(compressed);
        const baseName = (p.file.name || 'foto').replace(/\.[^.]+$/, '');
        const res = await uploadMediaRemote(S.selectedCantiere, note.id, 'foto', baseName + '.jpg', 'image/jpeg', base64);
        bump();
        return res;
      });

      const audioUpload = hasAudio ? (async () => {
        const base64 = await blobToBase64(MEDIA_REC.audioBlob);
        const mimeType = MEDIA_REC.audioBlob.type || 'audio/webm';
        const ext = mimeType.includes('mp4') ? 'm4a' : 'webm';
        const res = await uploadMediaRemote(S.selectedCantiere, note.id, 'audio', 'nota_audio.' + ext, mimeType, base64);
        bump();
        return res;
      })() : null;

      const results = await Promise.all([...photoUploads, ...(audioUpload ? [audioUpload] : [])]);
      results.forEach(res => { if (res && res.media) S.media.push(res.media); });
    }

    S.savingNote = false; S.savingLabel = '';
    NOTE_DRAFT = null; resetRecorder();
    goto('cantiere');
  } catch (err) {
    S.savingNote = false; S.savingLabel = '';
    alert('Errore nel salvataggio: ' + err.message);
    render();
  }
}

function bindQuadernoEvents() {
  document.getElementById('qf-cantiere').addEventListener('change', e => { S.quadFilters.cantiere = e.target.value; render(); });
  document.getElementById('qf-operaio').addEventListener('change', e => { S.quadFilters.operaio = e.target.value; render(); });
  document.getElementById('qf-from').addEventListener('change', e => { S.quadFilters.from = e.target.value; render(); });
  document.getElementById('qf-to').addEventListener('change', e => { S.quadFilters.to = e.target.value; render(); });
  document.querySelectorAll('.ticket .main').forEach(el => {
    el.addEventListener('click', () => { S.editEntryId = el.dataset.id; FORM = null; goto('giornata'); });
  });
  document.querySelectorAll('.ticket .del').forEach(el => {
    el.addEventListener('click', async () => {
      if (!window.confirm('Eliminare questa giornata dal quaderno?')) return;
      S.entries = S.entries.filter(e => e.id !== el.dataset.id);
      try { await saveEntriesRemote(); } catch (err) { alert('Errore: ' + err.message); }
      render();
    });
  });
}

/* ================= INIT ================= */
function init() {
  if (hasSession()) {
    S.authed = true;
    S.screen = 'home';
    render();
    refreshData();
  } else {
    render();
  }
}
init();
</script>
